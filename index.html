<!DOCTYPE html>
<html>
<head>
    <title>aedesign | creative graphic &amp; brand design</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000000;
            text-align: center;
            overflow-x: hidden;
        }
        @media (min-width: 3080px) {
            .bgimg {
                position: absolute;
                top:0;
                left: 50%;
                transform: translateX(-50%);
                background: url("ae_WEB24_provizor_DESKTOP2.jpg") top center;
                background-size: contain;
                aspect-ratio: 3080 / 2550;
                width: 100%;
                max-width: 3080px;
                margin: 0 auto;
            }
        }
        @media (min-width: 1725px) and (max-width: 3080px) {
            .bgimg {
                position: absolute;
                top:0;
                left: 50%;
                transform: translateX(-50%);
                background: url("ae_WEB24_provizor_DESKTOP2.jpg") top center;
                background-size: contain;
                aspect-ratio: 3080 / 2550;
                width: 3080px;
                margin: 0 auto;
            }
        }
        @media (max-width: 1725px) {
            .bgimg {
                position: absolute;
                top:0;
                left: 50%;
                transform: translateX(-50%);
                background: url("ae_WEB24_provizor_MOBIL2.jpg") top center;
                background-size: contain;
                aspect-ratio: 1200 / 5327;
                width: 100%;
                max-width: 600px;
                margin: 0 auto;
            }
        }
    </style>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#000000">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
</head>
<body>
    <div class="bgimg">
    </div>
</body>
</html>
